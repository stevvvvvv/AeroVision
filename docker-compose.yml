services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./models:/app/models     # modèles entraînés (patchcore/*.pt, classifier.pt, yolo_defects.pt)
      - ./data/app:/app/data     # base SQLite + images d'inspection
    environment:
      AEROVISION_CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
